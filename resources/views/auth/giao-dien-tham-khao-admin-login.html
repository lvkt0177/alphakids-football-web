<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — EduClub Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0D9488;
    --accent-dark:#0B7A70;
    --accent-darker:#095F58;
    --accent-light:#E6F7F5;
    --accent-100:#CFF3EE;
    --bg:#F6F8F8;
    --surface:#FFFFFF;
    --border:#E3E9E8;
    --border-strong:#D3DCDA;
    --text:#1F2A2E;
    --text-secondary:#5B6B6E;
    --text-muted:#8A9799;
    --success:#1E8E5A;
    --success-bg:#E5F6ED;
    --danger:#C0392B;
    --danger-bg:#FCEAE8;
    --radius:14px;
    --radius-sm:9px;
    --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(14,43,41,0.06);
    --shadow-md:0 20px 46px rgba(14,43,41,0.10);
    --font-body:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-display:'Fredoka','Be Vietnam Pro',sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    font-size:14.5px;
  }
  h1,h2,p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;font-size:inherit;color:inherit;}

  :focus{outline:none;}
  .toggle-password:focus-visible,
  .btn-submit:focus-visible,
  .btn-back:focus-visible,
  .remember-row input:focus-visible{
    box-shadow:0 0 0 3px rgba(13,148,136,0.16);
    border-radius:6px;
  }
  .input-wrap input:focus,
  .input-wrap input:focus-visible{
    outline:none;
    box-shadow:none;
  }

  .login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }

  /* ---------- Card ---------- */
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes badgeIn{
    from{opacity:0;transform:scale(.75);}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes shake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }

  .login-card{
    width:100%;
    max-width:404px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:40px 34px 34px;
    animation:cardIn .6s cubic-bezier(.16,.8,.4,1) both;
  }
  .login-card.fade-out{
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .28s ease,transform .28s ease;
  }

  .brand{text-align:center;margin-bottom:32px;}
  .brand-badge{
    width:52px;height:52px;border-radius:14px;background:var(--accent-light);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
    animation:badgeIn .5s .12s cubic-bezier(.16,.8,.4,1) both;
  }
  .brand-badge svg{width:26px;height:26px;color:var(--accent-darker);}
  .brand-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:.01em;
    color:var(--text);
  }
  .brand-subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin-top:6px;
    font-weight:500;
  }

  /* ---------- Form ---------- */
  .field-group{margin-bottom:20px;}
  .field-group label{
    display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text);
  }

  .input-wrap{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    padding:0 12px;
    background:var(--surface);
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .input-wrap svg{width:17px;height:17px;color:var(--text-muted);flex-shrink:0;}
  .input-wrap input{
    flex:1;min-width:0;border:none;background:transparent;
    padding:12px 0;font-size:14px;color:var(--text);
  }
  .input-wrap input::placeholder{color:var(--text-muted);}
  .input-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(13,148,136,0.16);
  }

  .toggle-password{
    background:none;border:none;padding:6px;margin:0 -6px 0 0;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);
    border-radius:6px;
  }
  .toggle-password:hover{color:var(--text-secondary);}
  .toggle-password svg{width:18px;height:18px;}
  .toggle-password:focus-visible{box-shadow:0 0 0 3px var(--accent-100);}

  .error-text{
    display:none;font-size:12px;color:var(--danger);margin-top:7px;font-weight:500;
  }

  .field-group.error .input-wrap{
    border-color:var(--danger);
    box-shadow:0 0 0 4px var(--danger-bg);
  }
  .field-group.error .error-text{display:block;}
  .field-group.shake{animation:shake .4s ease;}

  .btn-submit{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:13px;border:none;border-radius:var(--radius-sm);
    background:var(--accent);color:#fff;
    font-size:14.5px;font-weight:700;
    transition:background .15s ease,transform .1s ease,opacity .15s ease;
  }
  .btn-submit:hover{background:var(--accent-dark);}
  .btn-submit:active{transform:scale(.985);}
  .btn-submit:disabled{opacity:.72;cursor:not-allowed;}

  .spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;
    animation:spin .7s linear infinite;display:none;flex-shrink:0;
  }
  .btn-submit.loading .spinner{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Placeholder screen (after fake login) ---------- */
  .placeholder-screen{
    display:none;
    width:100%;max-width:460px;text-align:center;
    animation:cardIn .5s cubic-bezier(.16,.8,.4,1) both;
  }
  .placeholder-screen.show{display:block;}
  .placeholder-badge{
    width:60px;height:60px;border-radius:16px;background:var(--accent-light);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  }
  .placeholder-badge svg{width:28px;height:28px;color:var(--accent-darker);}
  .placeholder-screen h2{
    font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--text);
  }
  .placeholder-screen p{
    font-size:13.5px;color:var(--text-secondary);margin-top:10px;line-height:1.6;
  }
  .btn-back{
    margin-top:26px;
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 18px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--text);font-size:13px;font-weight:600;
  }
  .btn-back:hover{background:var(--accent-light);border-color:var(--accent-100);color:var(--accent-darker);}
  .btn-back svg{width:15px;height:15px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#183531;color:#fff;padding:13px 20px;border-radius:12px;
    display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;
    box-shadow:0 10px 30px rgba(14,43,41,0.28);opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;z-index:100;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast svg{width:18px;height:18px;color:#4ADE9B;flex-shrink:0;}

  /* ---------- Responsive ---------- */
  @media (max-width:420px){
    .login-card{padding:32px 22px 26px;border-radius:var(--radius);}
    .brand-badge{width:46px;height:46px;}
    .brand-name{font-size:23px;}
  }
</style>
</head>
<body>

<div class="login-page">

  <div class="login-card" id="loginCard">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9 12 5 2 9l10 4 10-4Z"/><path d="M6 11v4c0 1.5 2.7 3 6 3s6-1.5 6-3v-4"/><path d="M22 9v6"/></svg>
      </div>
      <h1 class="brand-name">EduClub</h1>
      <p class="brand-subtitle">Trang quản trị nội bộ</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field-group" id="usernameGroup">
        <label for="username">Tên đăng nhập</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>
          <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" autocomplete="off">
        </div>
        <p class="error-text">Vui lòng nhập tên đăng nhập.</p>
      </div>

      <div class="field-group" id="passwordGroup">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="error-text">Vui lòng nhập mật khẩu.</p>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner"></span>
        <span id="submitLabel">Đăng nhập</span>
      </button>
    </form>
  </div>

  <div class="placeholder-screen" id="placeholderScreen">
    <div class="placeholder-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 4v3M16 4v3"/></svg>
    </div>
    <h2>Admin Dashboard sẽ nối vào đây</h2>
    <p>Đây là màn hình demo — trang quản trị chính thức (Nội dung Trang chủ, Thông tin chung, Đăng ký học thử) sẽ được nối tiếp tại đây.</p>
    <button class="btn-back" id="backToLogin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Quay lại đăng nhập
    </button>
  </div>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
  <span id="toastMsg">Đăng nhập thành công</span>
</div>

<script>
  /* ---------- Toast ---------- */
  const toastEl = document.getElementById('toast');
  const toastMsgEl = document.getElementById('toastMsg');
  let toastTimer;
  function showToast(msg){
    toastMsgEl.textContent = msg || 'Đăng nhập thành công';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  /* ---------- Toggle show/hide password ---------- */
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  const eyeOpenPath = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeOffPath = '<path d="M3 3l18 18"/><path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword ? eyeOffPath : eyeOpenPath;
    toggleBtn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  });

  /* ---------- Form validate + fake login ---------- */
  const form = document.getElementById('loginForm');
  const usernameGroup = document.getElementById('usernameGroup');
  const passwordGroup = document.getElementById('passwordGroup');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');
  const loginCard = document.getElementById('loginCard');
  const placeholderScreen = document.getElementById('placeholderScreen');

  function setFieldError(group, hasError){
    group.classList.toggle('error', hasError);
    if(hasError){
      group.classList.remove('shake');
      void group.offsetWidth; // restart animation
      group.classList.add('shake');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const usernameVal = document.getElementById('username').value.trim();
    const passwordVal = passwordInput.value.trim();
    let hasError = false;

    if(!usernameVal){ setFieldError(usernameGroup, true); hasError = true; }
    else setFieldError(usernameGroup, false);

    if(!passwordVal){ setFieldError(passwordGroup, true); hasError = true; }
    else setFieldError(passwordGroup, false);

    if(hasError){
      const firstInvalid = usernameGroup.classList.contains('error') ? document.getElementById('username') : passwordInput;
      firstInvalid.focus();
      return;
    }

    /* Giả lập gọi API đăng nhập */
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    submitLabel.textContent = 'Đang đăng nhập...';

    setTimeout(() => {
      showToast('Đăng nhập thành công');

      setTimeout(() => {
        loginCard.classList.add('fade-out');
        setTimeout(() => {
          loginCard.style.display = 'none';
          placeholderScreen.classList.add('show');
        }, 280);
      }, 700);
    }, 650);
  });

  /* ---------- Quay lại đăng nhập (demo) ---------- */
  document.getElementById('backToLogin').addEventListener('click', () => {
    placeholderScreen.classList.remove('show');
    loginCard.style.display = 'block';
    loginCard.classList.remove('fade-out');
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
    submitLabel.textContent = 'Đăng nhập';
    setFieldError(usernameGroup, false);
    setFieldError(passwordGroup, false);
    form.reset();
  });
</script>
</body>
</html>
