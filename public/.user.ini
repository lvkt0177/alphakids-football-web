; Raises PHP's per-request upload ceiling so an admin can upload gallery
; videos over 300MB (app-level cap is 500MB - see
; Admin\ActivityController::MAX_VIDEO_KB). Only takes effect under
; PHP-FPM/CGI SAPIs, which read .user.ini from the docroot; Apache mod_php
; ignores this file (see the php_value fallback in public/.htaccess) and
; a reverse proxy in front of PHP (e.g. nginx) needs client_max_body_size
; raised separately at the web-server level - this file cannot reach that.
upload_max_filesize = 520M
post_max_size = 520M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
